[package]
name = "neo-desktop"
version = "0.1.0"
description = "Neo AI Assistant - Tauri Desktop App"
authors = ["Neo"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "neo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
log = "0.4"
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
dirs = "5.0"
lazy_static = "1.5"
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
tower = "0.4"
tungstenite = "0.24"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
urlencoding = "2.1"
mime_guess = "2"
# Só para desenhar as marcações NA IMAGEM (services/browser_local.rs). Desenhar
# na página fazia a tela do usuário piscar a cada passo e atrapalhava SPAs
# pesadas; aqui o navegador dele nunca é tocado. A versão já vinha na árvore
# pelo tauri — o que entra de novo é só o decoder de jpeg.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
