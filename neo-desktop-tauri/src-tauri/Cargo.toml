[package]
name = "neo-desktop"
version = "0.1.0"
description = "Neo AI Assistant - Tauri Desktop App"
authors = ["Neo"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "neo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
log = "0.4"
uuid = { version = "1.11", features = ["v4"] }
chrono = "0.4"
dirs = "5.0"
lazy_static = "1.5"
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
tower = "0.4"
tungstenite = "0.24"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
urlencoding = "2.1"
mime_guess = "2"
# Arquivos do usuário (services/file_ops.rs): hash que prova "o arquivo ainda é o
# que o Neo leu" antes de gravar. Já vinham na árvore por dependência do tauri.
sha2 = "0.10"
hex = "0.4"
# Shell (services/shell.rs): encerrar o GRUPO de processos no Parar e no timeout.
libc = "0.2"
# Só para desenhar as marcações NA IMAGEM (services/browser_local.rs). Desenhar
# na página fazia a tela do usuário piscar a cada passo e atrapalhava SPAs
# pesadas; aqui o navegador dele nunca é tocado. A versão já vinha na árvore
# pelo tauri — o que entra de novo é só o decoder de jpeg.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
neo-imagem = { path = "crates/neo-imagem" }

# O print do navegador local: as funções de imagem são genéricas e, sem isto,
# rodam sem otimização no `tauri dev` (~5 s por print de tela Retina; com isto,
# ~0,14 s). Só estas crates: o resto continua compilando rápido. Ver
# crates/neo-imagem/src/lib.rs.
[profile.dev.package.neo-imagem]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]
opt-level = 3
