# Proxy de saída do sandbox do Neo. Só o neo-workbench (na rede interna) fala com
# ele; ele encaminha para a internet MAS bloqueia destinos privados (ver ./filter).

Port 8888
Listen 0.0.0.0
Timeout 600

# Quem pode USAR o proxy. Só o sandbox alcança este proxy (rede interna dedicada),
# então liberar a origem é seguro; o controle de verdade é o filtro de DESTINO.
Allow 0.0.0.0/0

# Filtro de DESTINO (host da requisição). FilterDefaultDeny Off = denylist: nega o
# que casar em ./filter (os ranges privados). O resto (internet pública) passa.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Off
FilterExtended On
FilterCaseSensitive Off
# Casar contra o HOST, não a URL inteira (pega IP literal e nome).
FilterURLs Off

# Não anuncia que passou por um proxy.
DisableViaHeader On

# CONNECT só nas portas de web. Sem estas linhas, o túnel CONNECT abria QUALQUER
# porta de um host público — inclusive a 5434 (Postgres) do próprio servidor pelo
# IP público. O filtro de destino continua valendo; isto é a segunda tranca.
ConnectPort 443
ConnectPort 8443
