# ── Regras do cérebro ───────────────────────────────────────────────────────
- id: anexo-pergunta
  message: "de qual instituição é esse arquivo?"
  history:
    - role: user
      content: "ARQUIVOS ANEXADOS NESTA MENSAGEM:\n- extrato.pdf (file_id=f_123, application/pdf)"
  expect_intent: DIRECT_RESPONSE
  note: anexo está no catálogo do Neo — nunca inventar /Users/.../extrato.pdf

- id: imagem-mostra
  message: "mostra essa imagem aqui no chat: /Users/daniel/Desktop/print.png"
  expect_intent: DIRECT_RESPONSE
  note: caminho já citado → o cérebro emite [[IMAGE:...]]; nunca base64/cat

- id: evento-atual
  message: "qual o jogo do Flamengo hoje?"
  expect_intent: DIRECT_RESPONSE
  note: o cérebro busca na web sozinho (web_search inline)

- id: duvida-resposta-anterior
  message: "tem certeza disso?"
  history:
    - role: user
      content: "quanto custa o plano do Claude?"
    - role: assistant
      content: "O plano Pro custa 20 dólares por mês."
  expect_intent: DIRECT_RESPONSE
  guarded: true
  note: questionamento → re-verificação pelo cérebro

- id: memoria-lembra
  message: "lembra que eu prefiro café sem açúcar"
  expect_intent: DIRECT_RESPONSE
  guarded: true
  note: diretiva de memória → pks_remember no turno, nunca write_file

- id: memoria-salva-ideia
  message: "salva essa ideia: fazer um painel de custos por sessão"
  expect_intent: DIRECT_RESPONSE
  guarded: true

- id: saudacao
  message: "oi"
  expect_intent: DIRECT_RESPONSE
  expect_memory: false
  note: needs_memory=false em saudação

- id: continuidade-jogo
  message: "chuto 42"
  history:
    - role: assistant
      content: "Beleza, pensei em um número de 1 a 100. Pode chutar!"
  expect_intent: DIRECT_RESPONSE
  note: jogo em andamento

- id: dados-pessoais
  message: "quantas gramas de proteína eu como por dia?"
  expect_intent: DIRECT_RESPONSE
  note: dado pessoal vem do PKS, sem tool de arquivo

- id: assistente-estrangeiro
  message: "alexa, liga a luz da sala"
  expect_intent: DIRECT_RESPONSE
  guarded: true
  note: "sessão 2173af2b — persona precisa ver a mensagem"

- id: gravidade-alta
  message: "socorro, o banco de produção caiu e os clientes estão fora do ar"
  expect_intent: DIRECT_RESPONSE
  expect_gravity: alta
  note: sinal de tom, não muda o roteamento
