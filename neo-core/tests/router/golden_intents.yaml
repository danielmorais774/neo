# Golden set do classificador de intenção (ROUTER_SYSTEM_PROMPT).
#
# Usado por scripts/eval_router.py para comparar duas versões do prompt (A/B) no
# modelo real. Cada caso cobre UMA classe de decisão — quando um caso vira bug em
# produção, adicione-o aqui com a sessão no comentário, não um exemplo novo no
# prompt (exemplo custa token em toda mensagem; caso de teste, não).
#
# Campos:
#   id             identificador curto (aparece no relatório)
#   message        a mensagem do usuário
#   history        opcional, [{role, content}] — contexto dos turnos anteriores
#   expect_intent  intent esperado (obrigatório)
#   expect_tool    tool_name esperado (opcional; "null" exige tool_name vazio)
#   expect_skill   skill_name esperado (opcional)
#   expect_speech  speech_act esperado (opcional)
#   expect_plan    needs_plan esperado (opcional, bool)
#   expect_args    subconjunto de tool_arguments que precisa bater (opcional)
#   guarded        true quando um guard determinístico intercepta antes do LLM
#                  (o caso continua valendo: valida o pipeline, e custa 0 token)
#   note           por que o caso existe

# ── Regra mestra: sandbox do cérebro × máquina do usuário ────────────────────
- id: sandbox-primos
  message: "quantos números primos existem até 1 milhão?"
  expect_intent: DIRECT_RESPONSE
  note: computação pura — o cérebro roda no próprio sandbox

- id: sandbox-uuid-hash
  message: "gera um uuid v4 e me dá o sha256 dele"
  expect_intent: DIRECT_RESPONSE
  note: geração — sandbox, não precisa da máquina do usuário

- id: sandbox-download-csv
  message: "baixa esse csv https://exemplo.com/a.csv e me diz quantas linhas tem"
  expect_intent: DIRECT_RESPONSE
  note: baixar de URL + analisar é sandbox (o "baixa" engana o classificador)

- id: sandbox-converte-json
  message: "converte esse json pra yaml: {\"a\": 1, \"b\": [2,3]}"
  expect_intent: DIRECT_RESPONSE
  note: conversão de formato — sandbox

- id: sandbox-qrcode
  message: "gera um QR code com o link https://neo.local"
  expect_intent: DIRECT_RESPONSE
  note: geração de arquivo pelo cérebro (file_save + download), não CLIENT_TOOL

- id: cliente-disco-livre
  message: "quantos GB livres tem no meu disco?"
  expect_intent: CLIENT_TOOL
  expect_tool: run_command
  note: info do sistema DELE

- id: cliente-le-path-explicito
  message: "lê o arquivo ~/Downloads/relatorio.pdf"
  expect_intent: CLIENT_TOOL
  expect_tool: run_command
  note: caminho explícito na mensagem → run_command (nunca read_file, que não existe)

- id: cliente-find-env
  message: "acha os arquivos .env aqui no meu projeto"
  expect_intent: CLIENT_TOOL
  expect_tool: run_command
  note: busca no disco dele; comando exploratório não precisa de plano

- id: cliente-abre-vscode
  message: "abre o VSCode"
  expect_intent: CLIENT_TOOL
  expect_tool: run_command
  note: abrir programa na máquina dele

- id: cliente-instala-ffmpeg
  message: "instala o ffmpeg aqui na minha máquina"
  expect_intent: CLIENT_TOOL
  expect_tool: run_command
  note: instalação local

- id: texto-do-comando
  message: "qual o comando pra ver quanto espaço tem no disco?"
  expect_intent: DIRECT_RESPONSE
  note: pediu o TEXTO do comando — exceção da regra "agir é o padrão"

- id: arquivo-inexistente-nao-inventa
  message: "relatorio de financas em csv na minha area de trabalho"
  expect_intent: DIRECT_RESPONSE
  note: "sessão bd7a304d: virava read_file('/Users/.../relatorio.csv') inventado"

- id: arquivo-descrito-precisa-plano
  message: "manda pra mim aquele pdf da nota fiscal que tá no downloads"
  expect_intent: CLIENT_TOOL
  expect_plan: true
  note: arquivo existe mas só foi descrito → plano com sondagem ls/find antes

- id: followup-executa
  message: "e quais? lista os nomes"
  history:
    - role: user
      content: "tem algum arquivo grande no meu Downloads?"
    - role: assistant
      content: "Sim, encontrei 3 arquivos com mais de 1GB."
  expect_intent: CLIENT_TOOL
  note: "sessão 69feab87: follow-up curto é a MESMA tarefa, não conversa"

# ── Skills com efeito colateral × núcleo cognitivo ───────────────────────────
- id: ha-acende-luz
  message: "acende a luz da sala"
  expect_intent: HOME_ASSISTANT
  expect_skill: home_assistant
  expect_speech: imperative
  note: imperativo claro → skill

- id: ha-desliga-quarto
  message: "desliga as luzes do quarto"
  expect_intent: HOME_ASSISTANT
  expect_skill: home_assistant
  expect_speech: imperative

- id: ha-termostato
  message: "qual a temperatura do termostato?"
  expect_intent: HOME_ASSISTANT
  expect_skill: home_assistant
  note: consulta à casa inteligente ainda é a skill HA

- id: ha-cena
  message: "ativa o modo cinema"
  expect_intent: HOME_ASSISTANT
  expect_skill: home_assistant

- id: ha-definicao-nao-executa
  message: "cadastra uma brincadeira: se eu te provocar, você pode desligar a luz ou ameaçar desligar"
  expect_intent: DIRECT_RESPONSE
  expect_speech: definition
  note: definir regra ≠ executar; não pode inventar entity_id

- id: ha-condicional-habito
  message: "se eu costumo usar o ar nas quintas, pode ligar"
  expect_intent: DIRECT_RESPONSE
  guarded: true
  note: "sessão 6bb1d340 — guard _is_brain_reasoning_request"

- id: ha-pergunta-preferencia
  message: "como eu gosto de deixar a temperatura do quarto à noite?"
  expect_intent: DIRECT_RESPONSE
  guarded: true
  note: pergunta sobre preferência → cérebro lê o PKS

- id: cascata-luz-whatsapp
  message: "apaga todas as luzes da casa e manda um whatsapp pro porteiro avisando que vou dormir"
  expect_intent: HOME_ASSISTANT
  expect_pipeline: 2
  note: 2 ações independentes → pipeline_plan com 2 steps

# ── WhatsApp ────────────────────────────────────────────────────────────────
- id: wpp-mae
  message: "manda uma mensagem para minha mãe que vou chegar mais tarde"
  expect_intent: WHATSAPP_MESSAGING
  expect_args:
    recipient: "minha mãe"
  note: apelido passa cru, o pipeline resolve na agenda

- id: wpp-telefone
  message: "manda whatsapp pro 5511988217222: oi tudo bem?"
  expect_intent: WHATSAPP_MESSAGING
  expect_args:
    recipient: "5511988217222"

- id: wpp-comercial
  message: "pede uma pizza no Domino's"
  expect_intent: WHATSAPP_MESSAGING
  note: pedido comercial também é WhatsApp

- id: wpp-contact-source
  message: "procura o João na lista do WhatsApp e manda um oi"
  expect_intent: WHATSAPP_MESSAGING
  expect_args:
    contact_source: whatsapp

