[project]
name = "neo-core2"
version = "1.0.0"
description = "Neo Core 2 - Simple FastAPI service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "sqlmodel>=0.0.8",
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "motor>=3.3.0",
    "tiktoken>=0.7.0",
    "numpy>=1.26.0",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "trafilatura>=1.12",
    "ddgs>=9.0",
    "pypdf>=5.0",
    # Upload multipart das rotas /api/v1/files (FastAPI exige para UploadFile).
    "python-multipart>=0.0.9",
    # Fernet do cofre de credenciais (core/credentials/store.py).
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "shared", "modules", "db"]
